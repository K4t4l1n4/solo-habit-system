    <path d="M86,80 L94,78" stroke="#6ee7ff" stroke-width="3" stroke-linecap="round" filter="url(#glow6)"/>
    <path d="M106,78 L114,80" stroke="#6ee7ff" stroke-width="3" stroke-linecap="round" filter="url(#glow6)"/>
    <!-- Core chest gem -->
    <circle cx="100" cy="118" r="7" fill="none" stroke="#6ee7ff" stroke-width="1.5" opacity="0.7"/>
    <circle cx="100" cy="118" r="4" fill="#6ee7ff" opacity="0.5" filter="url(#glow6)"/>
