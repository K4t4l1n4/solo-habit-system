    <path d="M66,102 Q48,86 40,72" fill="none" stroke="#6ee7ff" stroke-width="0.8" opacity="0.3"/>
    <!-- Right wing -->
    <path d="M124,90 Q156,70 172,50 Q164,72 158,88 Q152,100 140,108 Q134,104 124,100 Z" fill="#0b0c1f" stroke="#6ee7ff" stroke-width="1.2" opacity="0.8"/>
    <!-- Wing feather lines right -->
    <path d="M130,96 Q150,78 162,60" fill="none" stroke="#6ee7ff" stroke-width="1" opacity="0.4"/>
    <path d="M134,102 Q152,86 160,72" fill="none" stroke="#6ee7ff" stroke-width="0.8" opacity="0.3"/>
    <!-- Halo/crown glow -->
    <ellipse cx="100" cy="46" rx="26" ry="6" fill="none" stroke="#6ee7ff" stroke-width="2" opacity="0.7" filter="url(#glow6)"/>
    <!-- Body -->
    <path d="M68,106 Q66,158 100,164 Q134,158 132,106 Q120,112 100,110 Q80,112 68,106Z" fill="#0b0c1f"/>
    <!-- Robe details -->
    <path d="M78,130 L100,124 L122,130" fill="none" stroke="#6ee7ff" stroke-width="1.2" opacity="0.5"/>
    <path d="M74,144 L100,136 L126,144" fill="none" stroke="#6ee7ff" stroke-width="1" opacity="0.35"/>
    <!-- Head -->
    <ellipse cx="100" cy="82" rx="28" ry="28" fill="#0b0c1f"/>
