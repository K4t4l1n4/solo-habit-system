    <path d="M76,90 Q44,70 28,50 Q36,72 42,88 Q48,100 60,108 Q66,104 76,100 Z" fill="#0b0c1f" stroke="#6ee7ff" stroke-width="1.2" opacity="0.8"/>
    <!-- Wing feather lines left -->
