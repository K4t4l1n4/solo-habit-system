<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="d3"><polygon points="100,6 194,100 100,194 6,100"/></clipPath>
    <radialGradient id="bg3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#18080e"/>
      <stop offset="100%" stop-color="#06060f"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ff4466"/>
      <stop offset="100%" stop-color="#8b0022"/>
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="100,6 194,100 100,194 6,100" fill="url(#bg3)" stroke="#6ee7ff" stroke-width="2.5"/>
  <polygon points="100,6 194,100 100,194 6,100" fill="none" stroke="#6ee7ff" stroke-width="8" opacity="0.12"/>
  <g clip-path="url(#d3)">
    <!-- Crown/head armor -->
    <path d="M72,58 L76,40 L82,56 L88,38 L94,56 L100,36 L106,56 L112,38 L118,56 L124,40 L128,58 Q128,52 100,50 Q72,52 72,58Z" fill="#0b0c1f" stroke="#6ee7ff" stroke-width="1" opacity="0.7"/>
    <!-- Body armor -->
    <path d="M60,120 Q58,165 100,168 Q142,165 140,120 L130,108 L100,112 L70,108 Z" fill="#0b0c1f"/>
    <!-- Head -->
    <ellipse cx="100" cy="84" rx="34" ry="32" fill="#0b0c1f"/>
    <!-- Large central eye -->
    <circle cx="100" cy="84" r="20" fill="url(#eyeGrad)" filter="url(#glow3)"/>
    <circle cx="100" cy="84" r="20" fill="none" stroke="#ff4466" stroke-width="2" opacity="0.6"/>
    <!-- Pupil -->
    <ellipse cx="100" cy="84" rx="5" ry="8" fill="#0a000a"/>
    <!-- Eye shine -->
    <circle cx="106" cy="79" r="3" fill="white" opacity="0.4"/>
    <!-- Collar/neck rings -->
    <ellipse cx="100" cy="112" rx="24" ry="6" fill="none" stroke="#6ee7ff" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="100" cy="118" rx="20" ry="5" fill="none" stroke="#6ee7ff" stroke-width="1" opacity="0.35"/>
    <!-- Side details -->
    <path d="M60,120 L62,130 M140,120 L138,130" stroke="#6ee7ff" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
